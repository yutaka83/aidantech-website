; Plugin settings
PLG_SYSTEM_LKIMACCESSIBILITY="System - LKIM Accessibility"
PLG_SYSTEM_LKIMACCESSIBILITY_NOTE_LABEL="Adjustments a visitor makes for themselves"
PLG_SYSTEM_LKIMACCESSIBILITY_NOTE_DESC="This panel does not replace accessible markup — it lets a visitor adjust what the page already gets right. Offer only what the site can honour: the hearing profile, for instance, flags media and points at the accessibility statement, because no plugin can caption a video it did not author."
PLG_SYSTEM_LKIMACCESSIBILITY_PROFILES_LABEL="Disability profiles"
PLG_SYSTEM_LKIMACCESSIBILITY_PROFILES_DESC="One tap sets several adjustments at once. Each is only a named set of the tools below, so a visitor can pick one and still change any single setting."
PLG_SYSTEM_LKIMACCESSIBILITY_TOOLS_LABEL="Individual adjustments"
PLG_SYSTEM_LKIMACCESSIBILITY_STATEMENT_LABEL="Accessibility statement link"
PLG_SYSTEM_LKIMACCESSIBILITY_STATEMENT_DESC="Linked at the foot of the panel. Required by MyGovEA, and the place to say how to request a transcript or an alternative format."
PLG_SYSTEM_LKIMACCESSIBILITY_APPEARANCE="Appearance"
PLG_SYSTEM_LKIMACCESSIBILITY_LAUNCHER_LABEL="Floating button"
PLG_SYSTEM_LKIMACCESSIBILITY_LAUNCHER_DESC="The round accessibility button above the page. With this off, the panel opens only from a template control carrying data-lkim-a11y."
PLG_SYSTEM_LKIMACCESSIBILITY_POSITION_LABEL="Panel side"
PLG_SYSTEM_LKIMACCESSIBILITY_WIDTH_LABEL="Panel width"
PLG_SYSTEM_LKIMACCESSIBILITY_WIDTH_DESC="Any CSS length. The tiles fill the width, so a wider panel means more per row and fewer rows to scroll."
PLG_SYSTEM_LKIMACCESSIBILITY_ACCENT_LABEL="Accent colour"
PLG_SYSTEM_LKIMACCESSIBILITY_ACCENT_DESC="Leave empty to follow the template's own palette."

